# Smoke tests against the real deployment.
# Vercel reports every deploy back to GitHub. When a Vercel deploy succeeds, this workflow runs
# the smoke suite: against the preview address for a pull request, and against the public
# production address (PRODUCTION_URL) for main. Vercel's one-off deploy addresses are behind
# a login, so production is always tested through its public domain.
# Other deploys, such as GitHub Pages, are ignored: they cannot run the payment server.
# A failure shows up as a red check on the pull request or commit.
name: Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'Address to test'
        default: 'https://freshmarket-gules.vercel.app'
        required: true
  schedule:
    - cron: '30 10 * * *' # daily at 6:30 am Toronto time, against production

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (${{ github.event.deployment_status.environment || 'Production' }})
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment_status.environment == 'Production' || startsWith(github.event.deployment_status.environment, 'Preview')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      HOME: /root
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://freshmarket-gules.vercel.app' }}
      SMOKE_URL: >-
        ${{ inputs.url ||
            (github.event.deployment_status.environment == 'Production' && (vars.PRODUCTION_URL || 'https://freshmarket-gules.vercel.app')) ||
            github.event.deployment_status.environment_url ||
            vars.PRODUCTION_URL || 'https://freshmarket-gules.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Smoke test ${{ env.SMOKE_URL }}
        run: npx playwright test -c playwright.smoke.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: smoke-report/
          retention-days: 14
