<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FreshMarket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with search + cart, department rail, product grid; drawer for cart, dialog for product + account */
:root{
  --bg:#f6f8f4; --surface:#ffffff; --ink:#17251b; --muted:#5d6b60; --line:#dde5da;
  --leaf:#2a7237; --leaf-ink:#ffffff; --leaf-soft:#e3f0e2; --sale:#f2c230; --sale-ink:#3a2c00; --danger:#b3261e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211b; --ink:#e8efe7; --muted:#9db0a1; --line:#2a372d;
  --leaf:#5cb86a; --leaf-ink:#0d1a10; --leaf-soft:#1f3324; --sale:#f2c230; --sale-ink:#2a2000; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --ink:#e8efe7; --muted:#9db0a1; --line:#2a372d;
  --leaf:#5cb86a; --leaf-ink:#0d1a10; --leaf-soft:#1f3324; --sale:#f2c230; --sale-ink:#2a2000; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--leaf);display:inline-block}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden}
.suggest button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 14px;border:0;background:none;text-align:left}
.suggest button:hover,.suggest button.on{background:var(--leaf-soft)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.cartbtn{background:var(--leaf);color:var(--leaf-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.count{background:var(--leaf-ink);color:var(--leaf);border-radius:99px;padding:0 8px;font-size:13px;font-variant-numeric:tabular-nums}
.store{font-size:13px;color:var(--muted);padding-bottom:10px}
.store b{color:var(--ink)}
nav.depts{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav.depts button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;white-space:nowrap;font-weight:600;font-size:14px}
nav.depts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-block:20px 60px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:54px;border:0;width:100%;padding:0}
.badge{position:absolute;top:18px;left:18px;background:var(--sale);color:var(--sale-ink);font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;letter-spacing:.03em;text-transform:uppercase}
.local{font-size:11px;font-weight:700;color:var(--leaf);text-transform:uppercase;letter-spacing:.06em}
.pname{font-weight:600;background:none;border:0;padding:0;text-align:left;line-height:1.3}
.pname:hover{text-decoration:underline}
.size{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;font-variant-numeric:tabular-nums}
.price b{font-size:18px}
.price s{color:var(--muted);font-size:13px}
.unit{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{background:var(--leaf);color:var(--leaf-ink);border:0;border-radius:9px;padding:8px;font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--leaf);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--leaf-soft);color:var(--leaf);width:36px;height:36px;font-size:18px;font-weight:700}
.qty span{font-weight:700;font-variant-numeric:tabular-nums}
.oos{font-size:13px;color:var(--danger);font-weight:600;padding:8px 0}
.empty{padding:40px 0;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--ink);margin:0 0 6px}
.more{display:block;margin:22px auto 0}
.scrim{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dhead h2,.modal h2{font-family:var(--display);margin:0;font-size:22px}
.x{background:none;border:0;font-size:24px;line-height:1;padding:4px 8px}
.lines{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .mini{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:28px}
.line .qty{width:110px;margin-top:6px}
.line .qty button{height:30px;width:30px}
.rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.totals{border-top:1px solid var(--line);padding:16px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between}
.totals .save{color:var(--leaf);font-weight:600}
.totals .grand{font-size:18px;font-weight:800;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.checkout{background:var(--leaf);color:var(--leaf-ink);border:0;border-radius:10px;padding:13px;font-weight:700;margin-top:8px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.panel{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;position:relative}
.panel .x{position:absolute;top:10px;right:10px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pd .thumb{font-size:110px;aspect-ratio:1}
@media (max-width:640px){.pd{grid-template-columns:1fr}.pd .thumb{aspect-ratio:4/3;font-size:80px}}
.pd h2{font-size:26px;line-height:1.15;margin:4px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;background:var(--leaf-soft);color:var(--leaf);padding:2px 8px;border-radius:6px;font-weight:600}
.stock{font-size:14px;font-weight:600}
.stock.ok{color:var(--leaf)}.stock.low{color:#b26a00}.stock.out{color:var(--danger)}
.nf{border:2px solid var(--ink);padding:8px 10px;font-size:13px;margin-top:14px;font-variant-numeric:tabular-nums}
.nf h3{margin:0;font-family:var(--display);font-size:16px;border-bottom:6px solid var(--ink);padding-bottom:4px}
.nf div{display:flex;justify-content:space-between;border-bottom:1px solid var(--ink);padding:2px 0}
.nf div:last-child{border:0}
.allergen{font-size:13px;margin-top:10px}
.buyrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.buyrow .qty{width:130px}
.buyrow .add{flex:1;padding:11px}
.weight{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.auth{width:min(420px,100%)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
label input{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font-weight:400;font-size:15px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.okmsg{color:var(--leaf);font-size:13px;font-weight:600}
.google{background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px;font-weight:600}
.link{background:none;border:0;color:var(--leaf);font-weight:600;padding:0;font-size:13px;justify-self:start}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:0 0 10px 10px;font-weight:700;text-decoration:none}
.skip:focus{top:0}
main:focus{outline:none}
.demo{background:var(--sale);color:var(--sale-ink);text-align:center;font-size:12px;font-weight:700;padding:5px 16px;letter-spacing:.02em}
.co{width:min(720px,100%)}
.payel{min-height:120px;margin:4px 0 10px}
.co .steps{padding-right:36px}
.panel.still{animation:none}
.store label{display:inline;font-size:13px;font-weight:400}
.steps,.track{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px;flex-wrap:wrap;counter-reset:st}
.steps li,.track li{counter-increment:st;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.steps li::before,.track li::before{content:counter(st);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:12px}
.steps li+li::after,.track li+li::after{content:none}
.steps li.cur,.track li.cur{color:var(--ink)}
.steps li.cur::before,.track li.cur::before{border-color:var(--leaf);background:var(--leaf);color:var(--leaf-ink)}
.steps li.done::before,.track li.done::before{content:"✓";border-color:var(--leaf);color:var(--leaf)}
.track{background:var(--bg);border-radius:10px;padding:10px 12px;gap:14px}
.co h2{margin-bottom:12px}.co h3{font-family:var(--display);font-size:17px;margin:18px 0 8px}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--leaf)}
.addr{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end}
@media (max-width:560px){.addr{grid-template-columns:1fr 1fr}.addr label:first-child{grid-column:1/-1}}
.pick{background:var(--bg);border-radius:10px;padding:12px;margin:0}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button,.slots button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.days button[aria-pressed="true"],.slots button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.slots button:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.slots small{display:block;font-size:11px;text-decoration:none}
.cofoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.cofoot .checkout{margin:0;padding:12px 18px}
.review{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin-bottom:14px}
.review>div:first-child{display:grid;gap:2px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.items li,.orders li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.co-totals{padding:8px 0 0;border-top:1px solid var(--line)}
.pm{border:0;padding:0;margin:0 0 6px;display:flex;gap:14px;flex-wrap:wrap}
.pm legend{font-size:13px;font-weight:600;margin-bottom:6px}
.radio{display:flex;flex-direction:row;align-items:center;gap:6px;font-weight:500;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orders{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.orders li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;align-items:center;flex-wrap:wrap}
.orders li>div:first-child{display:grid}
.oact{display:flex;gap:6px}.oact .ghost{padding:6px 10px;font-size:13px}
.pill{font-size:12px;font-weight:700;background:var(--leaf-soft);color:var(--leaf);padding:2px 10px;border-radius:99px}
#storeSel{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:2px 6px;font-weight:700;max-width:100%}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}.panel{animation:pop .18s ease-out}}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:.6}}
</style>

<div class="demo">Demo store · sample products and prices · no real orders or payments</div>
<header>
  <div class="wrap">
    <div class="bar">
      <button class="logo" id="home" aria-label="FreshMarket home"><i></i>FreshMarket</button>
      <div class="search">
        <input id="q" type="search" placeholder="Search apples, sourdough, salmon…" autocomplete="off" aria-label="Search products">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <button class="ghost" id="acct">Sign in</button>
      <button class="cartbtn" id="cartBtn">Cart <span class="count" id="count">0</span></button>

    <nav class="depts" id="depts" aria-label="Departments"></nav>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1">
  <div class="head">
    <div><h1 id="title">All departments</h1><p class="sub" id="subtitle"></p></div>
    <div class="tools">
      <select id="sort" aria-label="Sort products">
        <option value="pop">Most popular</option>
        <option value="new">Newest</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <button class="ghost more" id="more" hidden>Show more products</button>
</main>

// Stock differs by store. Square One uses the base figure.
function stockOf(p){if(S.store===0)return p.stock;if(S.store===1)return p.stock===0?24:(p.id%7===0?0:Math.max(2,Math.round(p.stock*0.6)));return p.stock===0?12:(p.id%9===4?2:p.stock+6)}
const money=n=>"$"+n.toFixed(2);

// fuzzy: Levenshtein against each word
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function score(p,q){q=q.toLowerCase().trim();if(!q)return 1;const hay=(p.name+" "+p.dept+" "+p.brand+" "+p.tags.join(" ")).toLowerCase();if(hay.includes(q))return 3;const words=hay.split(/[^a-z0-9]+/);let ok=0;for(const t of q.split(/\s+/)){if(words.some(w=>w.startsWith(t)))ok+=2;else if(words.some(w=>{const tol=t.length>6?2:1;return t.length>3&&(lev(t,w)<=tol||lev(t,w.slice(0,t.length))<=tol)}))ok+=1;else return 0}return ok}

function list(){let r=P.filter(p=>(!S.dept||p.dept===S.dept)&&(S.local?p.local:true)&&(S.sale?!!p.was:true)&&[...S.tags].every(t=>p.tags.includes(t)));
  if(S.q)r=r.map(p=>[p,score(p,S.q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const f={pop:(a,b)=>b.pop-a.pop,new:(a,b)=>b.isNew-a.isNew||b.pop-a.pop,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price}[S.sort];
  if(!S.q||S.sort!=="pop")r=[...r].sort(f);return r}

function qtyCtl(p,cls=""){const n=S.cart[p.id]||0;
  if(stockOf(p)===0)return `<div class="oos">Out of stock at this store</div>`;
  if(!n)return `<button class="add ${cls}" data-add="${p.id}">Add to cart</button>`;
  return `<div class="qty ${cls}"><button data-dec="${p.id}" aria-label="Decrease">−</button><span>${n}</span><button data-inc="${p.id}" aria-label="Increase">+</button></div>`}

  const r=list();

  else{$("grid").innerHTML=r.slice(0,S.shown).map(card).join("");$("more").hidden=r.length<=S.shown}

  $("acct").textContent=S.user?`Hi, ${S.user.name.split(" ")[0]}`:"Sign in";
  if(drawerOpen)renderCart();if(openProduct)renderProduct(openProduct);
}

// ---- keyboard focus for dialogs (open: focus moves in · Tab stays inside · close: focus returns)
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const focusKey=el=>{if(!el||el===document.body)return null;if(el.id)return"#"+CSS.escape(el.id);for(const a of el.getAttributeNames())if(a.startsWith("data-"))return`[${a}="${CSS.escape(el.getAttribute(a))}"]`;return null};
let opener=null,openerKey=null,lastKey=null;
document.addEventListener("focusin",e=>{if($("layer").contains(e.target))lastKey=focusKey(e.target)});
new MutationObserver(()=>{const layer=$("layer"),dlg=layer.querySelector('[role="dialog"]');
  if(!dlg){const back=(opener&&opener.isConnected)?opener:(openerKey&&document.querySelector(openerKey));opener=openerKey=lastKey=null;if(back)back.focus();return}
  if(!opener&&!layer.contains(document.activeElement)){opener=document.activeElement;openerKey=focusKey(opener)}
  if(dlg.contains(document.activeElement))return;
  const same=lastKey&&dlg.querySelector(lastKey);
  const first=dlg.querySelector('input:not([type=radio]):not([disabled]),select')||dlg.querySelector(FOCUSABLE);
  (same||first||dlg).focus();
}).observe($("layer"),{childList:true});
document.addEventListener("keydown",e=>{if(e.key!=="Tab")return;const dlg=$("layer").querySelector('[role="dialog"]');if(!dlg)return;
  const f=[...dlg.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);if(!f.length)return;
  const i=f.indexOf(document.activeElement);
  if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===-1||i===f.length-1)){e.preventDefault();f[0].focus()}});

document.addEventListener("submit",e=>{e.preventDefault();if(e.target.dataset.form==="pay"){placeOrder();return}const f=e.target.dataset.form,em=($("em")?.value||"").trim().toLowerCase(),pw=$("pw")?.value||"";
  if(f==="in"){
    // GP-81: never look up an account unless both fields are filled in and the email looks valid
    const need=!em?["em","Enter your email address."]:!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?["em","Enter a valid email address, like name@example.com."]:!pw?["pw","Enter your password."]:null;
    if(need){authBad=need[0];authMsg=`<p class="err" id="auth-err" role="alert">${need[1]}</p>`;const keep=$("em")?.value||"";renderAuth();$("em").value=keep;$(need[0]).focus();return}
    authBad="";const u=S.users[em];
    if(u&&u.fails>=5){authMsg=`<p class="err" role="alert">This account is locked after 5 failed attempts. Reset your password to unlock it.</p>`;return renderAuth()}
    if(!u||u.pw!==pw){if(u)u.fails++;const left=u?5-u.fails:null;authMsg=`<p class="err" role="alert">That email and password don't match.${u&&left>0?` ${left} attempt${left===1?"":"s"} left before the account locks.`:""}</p>`;return renderAuth()}
    if(!u.verified){authMsg=`<p class="err" role="alert">Verify your email first. We sent a link to ${esc(em)}.</p>`;u.verified=true;return renderAuth()}
    u.fails=0;signIn(u,em)}
  if(f==="up"){if(S.users[em]){authMsg=`<p class="err" role="alert">An account with this email already exists. Sign in instead.</p>`;return renderAuth()}
    if(!/\d/.test(pw)){authMsg=`<p class="err" role="alert">Add at least one number to your password.</p>`;return renderAuth()}
    S.users[em]={pw,name:$("nm").value.trim(),verified:false,fails:0};authMode="in";authMsg=`<p class="okmsg">Account created. We sent a verification link to ${esc(em)}. (Demo: sign in twice to simulate verifying.)</p>`;renderAuth()}
  if(f==="reset"){const u=S.users[em];if(u)u.fails=0;authMode="in";authMsg=`<p class="okmsg">If an account exists for ${esc(em)}, a reset link is on its way.</p>`;renderAuth()}
});

// ---- checkout (GP-6 time slots, GP-7 payment, GP-8 confirmation, tracking, history)
const DELIVERY_MIN=35,FREE_DELIVERY=50,DELIVERY_FEE=4.99,HOLD_MIN=30;

let PAY={stripe:false},stripeJs=null,stripeEls=null;
fetch("/api/config").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.stripe)PAY=j;else if(j&&j.setupProblem)console.warn("FreshMarket: Stripe is off. "+j.setupProblem)}).catch(()=>{});
function loadStripe(){if(stripeJs)return stripeJs;stripeJs=new Promise((ok,fail)=>{if(window.Stripe)return ok(window.Stripe(PAY.publishableKey));
  const sc=document.createElement("script");sc.src="https://js.stripe.com/v3/";sc.onload=()=>ok(window.Stripe(PAY.publishableKey));sc.onerror=()=>{stripeJs=null;fail(new Error("Stripe could not load"))};document.head.appendChild(sc)});return stripeJs}
const chargeCents=t=>Math.round((t.weighted?r2(t.total*1.1):r2(t.total))*100);
async function mountStripe(t){const box=$("pay-el");if(!box)return;
  try{const stripe=await loadStripe(),css=getComputedStyle(document.documentElement);
    stripeEls=stripe.elements({mode:"payment",amount:chargeCents(t),currency:"cad",captureMethod:t.weighted?"manual":"automatic",
      appearance:{theme:"stripe",variables:{colorPrimary:css.getPropertyValue("--leaf").trim(),colorText:css.getPropertyValue("--ink").trim(),colorBackground:css.getPropertyValue("--surface").trim(),borderRadius:"9px"}}});
    if($("pay-el")===box){const pe=stripeEls.create("payment",{layout:"tabs"});pe.on("loaderror",()=>{stripeEls=null;box.innerHTML=`<p class="err" role="alert" id="pay-loaderr">The payment form could not load. Refresh the page and try again.</p>`});pe.mount(box)}}
  catch(e){box.innerHTML=`<p class="err" role="alert">The payment form could not load. Check your connection and try again.</p>`}}
function showPayError(msg){const c=CO();c.err=msg;let el=$("co-err");
  if(!el){el=document.createElement("p");el.className="err";el.id="co-err";el.setAttribute("role","alert");$("pay-el").after(el)}el.textContent=msg}
async function stripePay(){const c=CO(),t=calc(c.mode),btn=document.querySelector('[data-form="pay"] button[type="submit"]');
  if(!stripeEls){showPayError("The payment form is still loading. Try again in a moment.");return}
  const label=btn.textContent;btn.disabled=true;btn.textContent="Processing…";
  const fail=msg=>{btn.disabled=false;btn.textContent=label;showPayError(msg)};
  try{const stripe=await loadStripe();
    const sub=await stripeEls.submit();if(sub.error)return fail(sub.error.message);
    const r=await fetch("/api/create-payment-intent",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mode:c.mode,items:t.items.map(({p,q})=>({id:p.id,q}))})});
    const j=await r.json().catch(()=>({}));if(!r.ok)return fail(j.error||"Payment could not start. Try again.");
    if(j.amountCents!==chargeCents(t))return fail("Prices changed while you were checking out. Go back and review your order.");
    const res=await stripe.confirmPayment({elements:stripeEls,clientSecret:j.clientSecret,redirect:"if_required",confirmParams:{return_url:location.href.split("#")[0]}});
    if(res.error)return fail(res.error.message||"Your payment was not approved. Try another payment method.");
    const pi=res.paymentIntent;if(!pi||!["succeeded","requires_capture","processing"].includes(pi.status))return fail("Your payment was not approved. Try another payment method.");
    finishOrder(PAY.testMode?"Stripe (test mode)":"Stripe",pi.id)}
  catch(e){fail("Something went wrong with the payment. You have not been charged. Try again.")}}
const CO=()=>S.co||(S.co={step:"fulfil",mode:"delivery",street:"",postal:"",zipOk:false,zipMsg:"",day:0,slot:null,held:null,pay:"card",card:{name:"",num:"",exp:"",cvc:""},err:""});
const cartItems=()=>Object.entries(S.cart).map(([id,q])=>({p:P.find(x=>x.id==id),q})).filter(x=>x.p);
function calc(mode){const items=cartItems();const sub=items.reduce((a,x)=>a+x.p.price*x.q,0),saved=items.reduce((a,x)=>a+(x.p.was?(x.p.was-x.p.price)*x.q:0),0);
  const fee=mode==="pickup"||!sub||sub>=FREE_DELIVERY?0:DELIVERY_FEE,hst=hstOf(items,fee),total=sub+hst+fee;
  return{items,sub,saved,hst,fee,total,weighted:items.some(x=>x.p.per)}}
const r2=n=>Math.round(n*100)/100;
// Same arithmetic as api/_pricing.js, so the server charge always matches what the shopper sees
function hstOf(items,fee){return(items.reduce((a,x)=>a+(x.p.taxable?x.p.price*x.q:0),0)+(HST_ON_DELIVERY_FEE?fee:0))*HST_RATE}
const dayStart=i=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+i)};

function slotsFor(day){const now=new Date(),d=dayStart(day),out=[];
  for(let h=10;h<20;h++){const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h);
    if(start-now<2*3600e3)continue; // needs 2 hours to pick
    out.push({h,start,full:(d.getDate()*3+h*7+S.store)%5===0})}return out}

    :`<div class="empty"><h2>No orders yet</h2><p>Your past orders and receipts will appear here.</p></div>`}`,"Your orders")}

function coValidateFulfil(){const c=CO(),t=calc(c.mode);
  if(c.mode==="delivery"){if(!c.street.trim())return"Enter your street address.";if(!c.zipOk)return"Check your postal code for delivery.";if(t.sub<DELIVERY_MIN)return`Delivery needs a minimum order of ${money(DELIVERY_MIN)}.`}
  if(c.slot===null)return"Choose a delivery or pickup time.";return""}
function checkZip(){const c=CO(),v=c.postal.trim().toUpperCase().replace(/\s+/,"");
  if(!/^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(v)){c.zipOk=false;c.zipMsg=`<p class="err" role="alert" id="co-zip">Enter a postal code like L5B 2C9.</p>`;return}
  c.postal=v.slice(0,3)+" "+v.slice(3);
  if(store().areas.includes(v.slice(0,3))){c.zipOk=true;c.zipMsg=`<p class="okmsg" id="co-zip">We deliver to ${c.postal}.</p>`}
  else{c.zipOk=false;c.zipMsg=`<p class="err" role="alert" id="co-zip">We don't deliver to ${c.postal} from ${esc(store().name)} yet. Choose pickup or another store.</p>`}}
function luhn(n){let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0}
function readCard(){const c=CO();if(c.pay!=="card")return;for(const [k,id] of [["name","cc-name"],["num","cc-num"],["exp","cc-exp"],["cvc","cc-cvc"]])c.card[k]=$(id)?.value||""}
function cardError(){const c=CO().card,num=c.num.replace(/\s|-/g,"");
  if(!c.name.trim())return"Enter the name on the card.";
  if(!/^\d{13,19}$/.test(num)||!luhn(num))return"Check the card number. It should be 13 to 19 digits.";
  const m=c.exp.match(/^(\d{2})\s*\/\s*(\d{2})$/);if(!m||+m[1]<1||+m[1]>12)return"Enter the expiry as MM/YY.";
  const now=new Date(),endOfMonth=new Date(2000+ +m[2],+m[1],1);if(endOfMonth<=now)return"This card has expired. Use another card.";
  if(!/^\d{3,4}$/.test(c.cvc))return"Enter the 3 or 4 digit security code.";
  if(num==="4000000000000002")return"Your card was declined. Try another card or payment method.";return""}
function placeOrder(){const c=CO();readCard();
  if(c.held&&Date.now()>c.held){c.step="fulfil";c.slot=null;c.held=null;c.err="Your time slot hold expired. Choose a time again.";renderCheckout();return}
  if(PAY.stripe){stripePay();return}
  if(c.pay==="card"){const e=cardError();if(e){c.err=e;renderCheckout();return}}
  const num=c.card.num.replace(/\s|-/g,"");
  finishOrder(c.pay==="card"?`card ending in ${num.slice(-4)}`:c.pay==="apple"?"Apple Pay":"Google Pay")}
function finishOrder(paidWith,paymentId){const c=CO(),t=calc(c.mode);
  const o={id:nextOrderNo(),created:new Date().toISOString(),email:S.user.email,mode:c.mode,when:slotLabel(c.day,c.slot),
    where:c.mode==="delivery"?`${c.street}, ${c.postal}`:`FreshMarket ${store().name}, ${store().addr}`,
    items:t.items.map(({p,q})=>({id:p.id,name:p.name,emoji:p.emoji,q,price:p.price})),sub:r2(t.sub),saved:r2(t.saved),hst:r2(t.hst),fee:t.fee,total:r2(t.total),status:0,
    paidWith,paymentId:paymentId||null};
  saveOrders([o,...(S.orders||[])]);S.cart={};save();S.co=null;render();renderOrder(o,true)}

document.addEventListener("click",e=>{const t=e.target.closest("button,input[data-pay]");if(!t)return;const d=t.dataset,c=CO();
  const keep=()=>{if($("co-street"))c.street=$("co-street").value;if($("co-postal"))c.postal=$("co-postal").value;readCard()};
  if(d.fm){keep();c.mode=d.fm;c.err="";renderCheckout()}
  else if(d.co==="zip"){keep();checkZip();c.err="";renderCheckout()}
  else if(d.day!==undefined){keep();c.day=+d.day;c.slot=null;c.held=null;renderCheckout()}
  else if(d.slot!==undefined){keep();c.slot=+d.slot;c.held=Date.now()+HOLD_MIN*60e3;c.err="";renderCheckout()}
  else if(d.co==="next"){keep();if(c.mode==="delivery"&&!c.zipOk&&c.postal.trim())checkZip();const err=coValidateFulfil();c.err=err;if(!err)c.step="pay";renderCheckout()}
  else if(d.co==="back"){keep();c.step="fulfil";c.err="";renderCheckout()}
  else if(d.pay){keep();c.pay=d.pay;c.err="";renderCheckout()}
  else if(d.advance){const os=S.orders.map(o=>o.id===d.advance?{...o,status:Math.min(o.status+1,STATUS[o.mode].length-1)}:o);saveOrders(os);const o=os.find(x=>x.id===d.advance);
    toast(`Status update sent by email and SMS: ${STATUS[o.mode][o.status]}`);renderOrder(o,false)}
  else if(d.orders!==undefined)renderOrders();
  else if(d.order)renderOrder(S.orders.find(o=>o.id===d.order),false);
  else if(d.reorder){const o=S.orders.find(x=>x.id===d.reorder);let added=0,skipped=0;
    for(const x of o.items){const p=P.find(y=>y.id===x.id),room=stockOf(p)-(S.cart[p.id]||0),n=Math.min(x.q,Math.max(0,room));if(n>0){S.cart[p.id]=(S.cart[p.id]||0)+n;added+=n}if(n<x.q)skipped++}
    save();closeLayer();render();toast(`Added ${added} item${added===1?"":"s"} to your cart${skipped?`. ${skipped} item${skipped===1?" is":"s are"} out of stock`:""}.`)}
});

// ---- search autocomplete
let sel=-1;
function suggest(){const v=$("q").value.trim(),box=$("suggest");if(v.length<2){box.hidden=true;return}
  const r=P.map(p=>[p,score(p,v)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||b[0].pop-a[0].pop).slice(0,6);
  if(!r.length){box.innerHTML=`<div style="padding:10px 14px" class="note">No matches. Press Enter to see suggestions.</div>`;box.hidden=false;return}
  box.innerHTML=r.map(([p],i)=>`<button data-s="${p.id}" class="${i===sel?"on":""}"><span style="font-size:20px">${p.emoji}</span><span style="flex:1;min-width:0">${esc(p.name)}<br><span class="size">${p.dept}</span></span><b style="font-variant-numeric:tabular-nums">${money(p.price)}</b></button>`).join("");box.hidden=false}
$("q").addEventListener("input",()=>{sel=-1;suggest()});
$("q").addEventListener("keydown",e=>{const items=[...$("suggest").querySelectorAll("button")];
  if(e.key==="ArrowDown"){sel=Math.min(sel+1,items.length-1);suggest();e.preventDefault()}
  else if(e.key==="ArrowUp"){sel=Math.max(sel-1,-1);suggest();e.preventDefault()}
  else if(e.key==="Enter"){e.preventDefault();if(sel>=0&&items[sel]){renderProduct(items[sel].dataset.s)}else{S.q=$("q").value.trim();S.dept=null;S.shown=12;render()}$("suggest").hidden=true}});
$("suggest").addEventListener("mousedown",e=>{const b=e.target.closest("[data-s]");if(b){e.preventDefault();$("suggest").hidden=true;renderProduct(b.dataset.s)}});
$("q").addEventListener("blur",()=>setTimeout(()=>$("suggest").hidden=true,100));
renderStore();
$("storeSel").onchange=e=>setStore(+e.target.value);
render();
</script>
</body></html>
